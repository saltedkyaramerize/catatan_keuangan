<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riwayat Keuangan</title>
<style>
:root{--cream:#f0e5d0;--pur:#7a52f4;--dk:#150c33;--bd:#cdbf9f;--in:#7ee2b0;--out:#ff9d8c;
--serif:"Cambria","Noto Serif","Georgia","Times New Roman",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0716}
body{display:flex;align-items:center;justify-content:center;min-height:100dvh;
padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
font-family:var(--serif);color:var(--cream)}

/* Kartu utama: rasio sama dengan desain PDF (836,25 x 1057,5) */
.stage{position:relative;overflow:hidden;aspect-ratio:836.25/1057.5;
width:min(100vw,calc(100dvh*0.7907));container-type:inline-size;background:#2a1b66}
.stage img.l{position:absolute;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.bg{left:0;top:0;width:100%;height:100%}
.ov{left:0;top:0;width:100%}
.ph{left:1.17%;top:-2.35%;width:94.39%}
.title{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.title text{font:italic 700 130.8px var(--serif);fill:var(--cream);filter:drop-shadow(0 4px 6px rgba(10,4,30,.55))}

.tbtn{position:absolute;background:none;border:0;padding:0;margin:0;color:var(--cream);font:700 1em var(--serif);cursor:pointer;
text-shadow:0 1px 4px rgba(10,4,30,.6);line-height:1}
.tbtn:active{opacity:.7}
.hist{left:3.77%;top:3.5%;font-size:1.96cqw;display:flex;align-items:center;gap:1.2cqw;padding:1cqw 1.5cqw 1cqw 0}
.hist img{width:5.92cqw;height:auto;display:block}
.rst{right:3.5%;top:3.2%;font-size:2.93cqw;padding:1cqw 1cqw}
.inp{left:6.2%;top:92%;font-size:4.37cqw;padding:1cqw 1.5cqw}

/* Bar pemasukan / pengeluaran */
.bar{position:absolute;left:23.06%;width:53.9%;aspect-ratio:601/89}
.bar img{position:absolute;inset:0;width:100%;height:100%;display:block}
.bar .lb{position:absolute;left:0;top:0;width:63%;height:100%;display:flex;align-items:center;justify-content:center;
font-weight:700;font-size:3.3cqw;line-height:1;text-shadow:0 1px 3px rgba(40,20,110,.7);white-space:nowrap}
.bar .vl{position:absolute;left:62%;top:0;width:31%;height:100%;display:flex;align-items:center;justify-content:center;
font-weight:700;font-size:2.2cqw;line-height:1;white-space:nowrap}
.b1{top:73.68%}.b2{top:80.78%}
.b1 .vl{color:var(--in)}.b2 .vl{color:var(--out)}

/* Popup */
.ov2{position:fixed;inset:0;background:rgba(8,4,24,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov2.show{display:flex}
.dlg{width:100%;max-width:400px;max-height:88dvh;overflow:auto;border-radius:16px;padding:20px;
background:linear-gradient(170deg,#32207a 0%,#1b0f45 55%,#12092e 100%);border:1px solid var(--bd);
box-shadow:0 0 0 4px rgba(205,191,159,.12),0 18px 50px rgba(0,0,0,.55);font-family:var(--serif)}
.dlg h2{margin:0 0 14px;font-size:20px;font-style:italic;color:var(--cream);text-align:center;letter-spacing:.3px}
.dlg label{display:block;font-size:13px;color:#b9aee0;margin:14px 0 6px}
.dlg input[type=text],.dlg textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #5b3fc4;background:#0f0829;
color:var(--cream);font:inherit;font-size:16px;outline:none}
.dlg input[type=text]:focus,.dlg textarea:focus{border-color:var(--cream)}
.dlg textarea{resize:vertical;min-height:60px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px 6px;border-radius:999px;border:1px solid #5b3fc4;background:#0f0829;color:#b9aee0;
font:700 15px var(--serif);cursor:pointer}
.seg button.on{background:linear-gradient(180deg,#8f6bff,#6b45ea);border-color:var(--cream);color:var(--cream)}
.acts{display:flex;gap:10px;margin-top:18px}
.acts button{flex:1;padding:12px;border-radius:999px;font:700 15px var(--serif);cursor:pointer;border:1px solid var(--bd);
background:transparent;color:var(--cream)}
.acts button.pri{background:linear-gradient(180deg,#8f6bff,#6b45ea);border-color:var(--cream)}
.acts button.dng{background:linear-gradient(180deg,#e3604b,#b9402e);border-color:var(--cream)}
.acts button:disabled{opacity:.6}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(205,191,159,.25)}
.kv span{color:#b9aee0}.kv b{text-align:right;word-break:break-word}
.in{color:var(--in)}.out{color:var(--out)}
.mu{font-size:14px;color:#b9aee0;line-height:1.5}
.chk{display:flex;gap:10px;align-items:center;margin:16px 0 0;font-size:14px;color:var(--cream)}
.chk input{width:18px;height:18px;accent-color:#7a52f4;margin:0}
.dlg label.chk{color:var(--cream);margin-top:16px}
.hl{margin:0;padding:0;list-style:none;max-height:46dvh;overflow:auto}
.hl li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(205,191,159,.2)}
.hl .d{font-size:12px;color:#b9aee0}.hl .n{font-size:13px;color:#d9d0f2;word-break:break-word}
.hl .a{font-weight:700;white-space:nowrap}
.empty{text-align:center;color:#b9aee0;padding:22px 0}
.saldo{display:flex;justify-content:space-between;padding:0 0 10px;border-bottom:1px solid rgba(205,191,159,.35);margin-bottom:4px;font-size:15px}
</style>
</head>

  <button class="tbtn inp" id="inp">input</button>

<!-- Popup input -->
<div class="ov2" id="ov">
  <div class="dlg">
    <div id="s1">
      <h2>Input Transaksi</h2>
      <div class="seg">
        <button id="t-in" class="on">Pemasukan</button>
        <button id="t-out">Pengeluaran</button>
      </div>
      <label for="amount">Total uang (Rp)</label>
      <input type="text" id="amount" inputmode="numeric" placeholder="0" autocomplete="off">
      <label for="memo">Catatan (opsional)</label>
      <textarea id="memo" placeholder="Contoh: bayar listrik bulan ini"></textarea>
      <div class="acts">
        <button id="cx">Batal</button>
        <button class="pri" id="go">Lanjut</button>
      </div>
    </div>
    <div id="s2" style="display:none">
      <h2>Konfirmasi transaksi</h2>
      <div id="sumry"></div>
      <div class="acts">
        <button id="no">Ubah</button>
        <button class="pri" id="yes">Konfirmasi</button>
      </div>
    </div>
  </div>
</div>

<!-- Popup riwayat -->
<div class="ov2" id="ovh">
  <div class="dlg">
    <h2>Riwayat Keuangan</h2>
    <div class="saldo"><span>Saldo</span><b id="bal">Rp 0</b></div>
    <ul class="hl" id="hl"></ul>
    <div class="acts"><button id="hx">Tutup</button></div>
  </div>
</div>

<!-- Popup reset -->
<div class="ov2" id="ov2">
  <div class="dlg">
    <h2>Reset semua histori?</h2>
    <div class="mu">Saldo, pemasukan, dan pengeluaran di web akan kembali ke Rp 0. Tindakan ini tidak bisa dibatalkan.</div>
    <label class="chk"><input type="checkbox" id="rsx"> Hapus juga data di spreadsheet</label>
    <div class="acts">
      <button id="rno">Batal</button>
      <button class="dng" id="ryes">Reset</button>
    </div>
  </div>
</div>

<script>
var type="in",data=[],pending=null;
var $=function(i){return document.getElementById(i)};
function rp(n){return "Rp "+Math.round(n).toLocaleString("id-ID")}
function load(){try{data=JSON.parse(localStorage.getItem("keu")||"[]")}catch(e){data=[]}}
function save(){try{localStorage.setItem("keu",JSON.stringify(data))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function show(id,on){$(id).className="ov2"+(on?" show":"")}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fit(el,txt){el.textContent=txt;el.style.fontSize=txt.length>13?(2.2*13/txt.length)+"cqw":""}

function render(){
  var i=0,o=0;data.forEach(function(d){d.type=="in"?i+=d.amount:o+=d.amount});
  fit($("tin"),rp(i));fit($("tout"),rp(o));$("bal").textContent=rp(i-o);
  var h=data.slice().reverse().map(function(d){
    return '<li><div><div class="d">'+esc(d.date)+' · '+(d.type=="in"?"Pemasukan":"Pengeluaran")+'</div>'+
      (d.memo?'<div class="n">'+esc(d.memo)+'</div>':'')+'</div>'+
      '<div class="a '+d.type+'">'+(d.type=="in"?"+":"−")+rp(d.amount)+'</div></li>';
  }).join("");
  $("hl").innerHTML=h||'<li class="empty" style="display:block;border:0">Belum ada riwayat</li>';
}

function setType(t){type=t;$("t-in").className=t=="in"?"on":"";$("t-out").className=t=="out"?"on":""}
function step(n){$("s1").style.display=n==1?"":"none";$("s2").style.display=n==2?"":"none"}

/* Popup input */
$("inp").onclick=function(){setType("in");$("amount").value="";$("memo").value="";step(1);show("ov",true);setTimeout(function(){$("amount").focus()},50)};
$("cx").onclick=function(){show("ov",false)};
$("t-in").onclick=function(){setType("in")};
$("t-out").onclick=function(){setType("out")};
$("amount").oninput=function(){var v=this.value.replace(/\D/g,"");this.value=v?Number(v).toLocaleString("id-ID"):""};
$("go").onclick=function(){
  var a=Number($("amount").value.replace(/\D/g,""));
  if(!a){$("amount").focus();return}
  pending={type:type,amount:a,date:today(),memo:$("memo").value.trim()};
  $("sumry").innerHTML=
   '<div class="kv"><span>Jenis</span><b>'+(type=="in"?"Pemasukan":"Pengeluaran")+'</b></div>'+
   '<div class="kv"><span>Jumlah</span><b class="'+type+'">'+rp(a)+'</b></div>'+
   '<div class="kv"><span>Tanggal</span><b>'+esc(pending.date)+'</b></div>'+
   '<div class="kv"><span>Catatan</span><b>'+(pending.memo?esc(pending.memo):"–")+'</b></div>';
  step(2);
};
$("no").onclick=function(){step(1)};

var WEBAPP_URL="https://script.google.com/macros/s/AKfycbyYwGxdnNJnaX-nqzFcuf99Q8-j60PKje9XiT0E9TiemL49s0i6oXB92SveQk9cOz4/exec";
function send(p){return fetch(WEBAPP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)}).then(function(r){return r.json()})}
$("yes").onclick=function(){
  var b=this;pending.date=today();b.disabled=true;b.textContent="Mengirim...";
  send(pending).then(function(r){
    if(!r||!r.ok)throw 0;
    data.push(pending);save();render();show("ov",false);
  }).catch(function(){alert("Gagal mengirim ke spreadsheet. Coba lagi.")})
  .then(function(){b.disabled=false;b.textContent="Konfirmasi"});
};

/* Riwayat */
$("hs").onclick=function(){show("ovh",true)};
$("hx").onclick=function(){show("ovh",false)};

/* Reset */
$("rs").onclick=function(){$("rsx").checked=false;show("ov2",true)};
$("rno").onclick=function(){show("ov2",false)};
$("ryes").onclick=function(){
  var b=this;
  function done(){data=[];save();render();show("ov2",false)}
  if(!$("rsx").checked){done();return}
  b.disabled=true;b.textContent="Menghapus...";
  send({action:"reset"}).then(function(r){
    if(!r||!r.ok)throw 0;
    done();
  }).catch(function(){alert("Gagal menghapus data spreadsheet. Coba lagi.")})
  .then(function(){b.disabled=false;b.textContent="Reset"});
};

/* Tutup popup saat klik area gelap */
["ov","ovh","ov2"].forEach(function(id){
  $(id).addEventListener("click",function(e){if(e.target===this)show(id,false)});
});

load();setType("in");render();
</script>
</body>
</html>
